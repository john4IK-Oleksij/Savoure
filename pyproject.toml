[project]
name = "savoure"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django-stubs-ext>=6.1.2",
    "gunicorn>=27.0.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django>=5.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*/migrations/*", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

