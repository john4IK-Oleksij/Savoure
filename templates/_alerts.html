{% if messages %}
<div class="alerts-container">
  {% for message in messages %}
    <div class="alert alert--{{ message.tags|default:'info' }}" role="alert">
      <span>{{ message }}</span>
      <button type="button" class="alert__close" onclick="this.parentElement.remove()" aria-label="Закрити">&times;</button>
    </div>
  {% endfor %}
</div>
{% endif %}
