{% if messages %}
<div class="toast-container" aria-live="polite">
  {% for message in messages %}
    <div class="toast toast--{{ message.tags|default:'info' }}" role="alert">
      <div class="toast__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          {% if message.tags == 'success' %}
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
          {% elif message.tags == 'error' %}
            <circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>
          {% else %}
            <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>
          {% endif %}
        </svg>
      </div>
      <div class="toast__content">
        <h4 class="toast__title">
          {% if message.tags == 'success' %}Успішно{% elif message.tags == 'error' %}Помилка{% elif message.tags == 'warning' %}Увага{% else %}Повідомлення{% endif %}
        </h4>
        <p class="toast__text">{{ message }}</p>
      </div>
      <button type="button" class="toast__close" aria-label="Закрити">&times;</button>
      <div class="toast__progress" aria-hidden="true"></div>
    </div>
  {% endfor %}
</div>
{% endif %}
