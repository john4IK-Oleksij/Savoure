{% extends "admin/base.html" %}
{% load static %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | SAVOURE Backstage{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <link rel="icon" href="{% static 'assets/img/admin-favicon.svg' %}" type="image/svg+xml">
    <link rel="alternate icon" href="{% static 'favicon-32x32.png' %}" type="image/png">
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
        <span style="font-family: serif; font-size: 20px; font-weight: 700; color: #e5b869; letter-spacing: 1px;">⚜ SAVOURE</span>
        <span style="font-size: 13px; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px; font-weight: 400;">Backstage</span>
    </a>
</div>
{% endblock %}
